<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/svg+xml" href="icono_gestion.svg">
    <link rel="apple-touch-icon" href="icono_gestion.svg">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Newton Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Anek Latin', sans-serif; background-color: #112464; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden" x-data="loginForm()">
        
        <div class="bg-gray-50 p-8 text-center border-b border-gray-100">
            <img src="https://i.postimg.cc/W45SpCYb/insignia_azul_sello.png" alt="Logo" class="h-24 mx-auto 1rem object-contain">
            <h1 class="text-2xl font-bold text-[#112464]">NEWTON</h1>
            <p class="text-[0.65rem] text-gray-400 uppercase tracking-widest -mt-1.5">Gestión Escolar</p>
        </div>

        <form @submit.prevent="handleLogin" class="p-8 space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Usuario</label>
                <input type="text" x-model="form.usuario" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Contraseña</label>
                <input type="password" x-model="form.password" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
            </div>

            <template x-if="mensaje">
                <div class="p-3 rounded-xl text-xs font-medium" 
                     :class="error ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-blue-50 text-blue-600 border border-blue-100'">
                    <p x-text="mensaje"></p>
                </div>
            </template>

            <button type="submit" :disabled="loading"
                    class="w-full bg-[#112464] hover:bg-blue-900 text-white font-bold py-4 rounded-xl shadow-lg transition-all disabled:opacity-50">
                <span x-show="!loading">INGRESAR AL SISTEMA</span>
                <span x-show="loading">Verificando...</span>
            </button>
        </form>

        <div class="p-4 text-center bg-gray-50">
            <p class="text-[14px] text-gray-400 uppercase tracking-tight">Acceso Restringido a Personal Autorizado</p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
